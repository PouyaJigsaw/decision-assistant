# From the repo root: fly deploy -c apps/api/fly.toml
# dockerfile is relative to this file, build context is the repo root.
app = "decision-assistant"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DATABASE_PATH = "/data/decision-assistant.db"
  PROVIDERS = "live"

[http_service]
  internal_port = 8080
  force_https = true

[mounts]
  source = "decision_data"
  destination = "/data"
